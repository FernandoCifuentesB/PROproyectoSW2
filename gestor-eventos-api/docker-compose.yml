services:
  db:
    image: postgres:15
    container_name: gestor_eventos_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor_eventos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestor_eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gestor_eventos_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: gestor_eventos_api
    restart: always
    ports:
      - "4000:4000"
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestor_eventos?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    command: npm run start:dev

  ai-worker:
    build:
      context: ../gestor-eventos-ai-worker
      dockerfile: Dockerfile
    container_name: gestor_eventos_ai_worker
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2

volumes:
  postgres_data: