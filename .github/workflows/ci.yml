name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build API and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gestor-eventos-api/package-lock.json
            gestor-eventos-web/package-lock.json

      - name: Instalar dependencias API
        working-directory: gestor-eventos-api
        run: npm ci

      - name: Build API
        working-directory: gestor-eventos-api
        run: npm run build

      - name: Instalar dependencias Web
        working-directory: gestor-eventos-web
        run: npm ci

      - name: Build Web
        working-directory: gestor-eventos-web
        run: npm run build

  test:
    name: Test API
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor-eventos-api/package-lock.json

      - name: Instalar dependencias API
        working-directory: gestor-eventos-api
        run: npm ci

      - name: Ejecutar tests API
        working-directory: gestor-eventos-api
        run: npm test -- --runInBand